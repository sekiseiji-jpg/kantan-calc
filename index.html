<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#eef1f4" />
  <meta name="description" content="四則演算と数式計算が簡単にできる電卓アプリ" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="電卓" />
  <link rel="stylesheet" href="style.css" />
  <title>かんたん電卓</title>
</head>
<body>
  <main class="calc" role="application" aria-label="かんたん電卓">
    <header class="topbar">
      <button class="icon-btn" id="historyBtn" aria-label="計算履歴">🕘</button>
      <span class="title">かんたん電卓</span>
      <button class="icon-btn" id="themeBtn" aria-label="設定">⚙️</button>
    </header>

    <div class="display">
      <div id="expression" class="expression" aria-live="polite"></div>
      <div id="result" class="result" aria-live="polite">0</div>
    </div>

    <div class="keys">
      <button class="key key-tax" data-action="tax-out" id="taxOutBtn">税抜 10%</button>
      <button class="key key-tax" data-action="tax-in" id="taxInBtn">税込 10%</button>

      <button class="key key-fn" data-action="clear">AC</button>
      <button class="key key-fn" data-action="back" aria-label="一文字削除">⌫</button>
      <button class="key key-fn" data-value="(">(</button>
      <button class="key key-fn" data-value=")">)</button>

      <button class="key" data-value="7">7</button>
      <button class="key" data-value="8">8</button>
      <button class="key" data-value="9">9</button>
      <button class="key key-op" data-value="÷">÷</button>

      <button class="key" data-value="4">4</button>
      <button class="key" data-value="5">5</button>
      <button class="key" data-value="6">6</button>
      <button class="key key-op" data-value="×">×</button>

      <button class="key" data-value="1">1</button>
      <button class="key" data-value="2">2</button>
      <button class="key" data-value="3">3</button>
      <button class="key key-op" data-value="-">−</button>

      <button class="key" data-value="0">0</button>
      <button class="key" data-value=".">.</button>
      <button class="key" data-value="000">000</button>
      <button class="key key-op" data-value="+">+</button>

      <button class="key key-op" data-value="%">%</button>
      <button class="key key-equal" data-action="equals">=</button>
    </div>

    <!-- テーマ選択ポップオーバー -->
    <div id="themePanel" class="theme-panel hidden" role="menu" aria-label="テーマ選択"></div>

    <!-- 履歴パネル -->
    <div id="historyPanel" class="panel hidden" aria-label="計算履歴">
      <div class="panel-head">
        <span class="panel-title">計算履歴</span>
        <div class="panel-actions">
          <button id="clearHistory" class="panel-btn">消去</button>
          <button id="closeHistory" class="panel-btn" aria-label="閉じる">✕</button>
        </div>
      </div>
      <p class="history-hint">式をタップ → 編集　／　結果をタップ → そのまま使用</p>
      <ul id="historyList" class="history-list"></ul>
      <p id="historyEmpty" class="history-empty">履歴はありません</p>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
